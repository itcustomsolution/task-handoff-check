name: Bounded two-tool packaging
on:
  push:
    branches: [codex/package-two-python-tools-20261021]
permissions:
  contents: read
concurrency:
  group: bounded-two-tool-packaging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'itcustomsolution/task-handoff-check' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read only public carrier checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify fixed entry and manifest, then run single reservation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/codex/package-two-python-tools-20261021
          printf '%s  %s\n' '17589afd3cc9a57583102e085f1f1746f86a89f32c8677ecc2e40fbfff96962c' 'release-packaging/bootstrap.py' | sha256sum --check --strict
          printf '%s  %s\n' '4a11586535af88fc763f2f682cd11ee57be2a55c91d04999a955941b05fcf911' 'release-packaging/MANIFEST.json' | sha256sum --check --strict
          exec /usr/bin/python3 -I -S release-packaging/bootstrap.py 4a11586535af88fc763f2f682cd11ee57be2a55c91d04999a955941b05fcf911
      - name: Reconcile exact owned cleanup without restarting work
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '17589afd3cc9a57583102e085f1f1746f86a89f32c8677ecc2e40fbfff96962c' 'release-packaging/bootstrap.py' | sha256sum --check --strict
          exec /usr/bin/python3 -I -S release-packaging/bootstrap.py cleanup 4a11586535af88fc763f2f682cd11ee57be2a55c91d04999a955941b05fcf911
