name: Tests
# Supported minimum and representative versions/platforms; pull requests only.
# Build inputs are hash-pinned (requirements/build.txt).
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install --require-hashes -r requirements/build.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Check installed entry point outside the source tree
        working-directory: ${{ runner.temp }}
        run: delivery-evidence-check --version
